/* ---------------- the clue timer: a round tank that drains ---------------- */
function WaterTimer({ total, left }: { total: number; left: number }) {
  const f = Math.max(0, left / total);
  const color = f > 0.35 ? "#3BB3C9" : f > 0.12 ? "#F2B544" : "#E5484D";
  const mm = Math.floor(left / 60); const ss = String(Math.max(0, left % 60)).padStart(2, "0");
  return (
    <div className="wtimer" role="timer" aria-label={left > 0 ? `${mm} minutes ${ss} seconds left` : "Time is up"}>
      <svg viewBox="0 0 200 200">
        <defs><clipPath id="tclip"><circle cx="100" cy="100" r="84" /></clipPath></defs>
        <circle cx="100" cy="100" r="92" fill="none" stroke="#E2DFD7" strokeWidth="8" />
        <motion.circle cx="100" cy="100" r="92" fill="none" stroke={color} strokeWidth="8" strokeLinecap="round" transform="rotate(-90 100 100)"
          strokeDasharray={2 * Math.PI * 92} animate={{ strokeDashoffset: 2 * Math.PI * 92 * (1 - f) }} transition={{ duration: 0.5, ease: "linear" }} />
        <g clipPath="url(#tclip)">
          <rect x="0" y="0" width="200" height="200" fill="#F4F3EF" />
          <motion.g animate={{ y: 16 + (1 - f) * 168 }} transition={{ duration: 0.6, ease: "easeOut" }}>
            <g className="twave"><path d="M-200 0 Q -175 -9 -150 0 T -100 0 T -50 0 T 0 0 T 50 0 T 100 0 T 150 0 T 200 0 T 250 0 T 300 0 T 350 0 T 400 0 V 220 H -200 Z" fill={color} opacity="0.22" /></g>
            <g className="twave slow"><path d="M-200 4 Q -170 -6 -140 4 T -80 4 T -20 4 T 40 4 T 100 4 T 160 4 T 220 4 T 280 4 T 340 4 T 400 4 V 220 H -200 Z" fill={color} opacity="0.38" /></g>
          </motion.g>
          {[30, 70, 110, 150].map((x, k) => <circle key={x} className="tbub" cx={x} cy="190" r={3 + (k % 2) * 2} style={{ animationDelay: `${k * 0.7}s` }} />)}
        </g>
      </svg>
      <div className="tlabel"><strong>{left > 0 ? `${mm}:${ss}` : "Time’s up"}</strong><span>{left > 0 ? "for clues" : "Start the vote"}</span></div>
    </div>
  );
}

function Confetti({ run }: { run: number }) {
  const bits = useMemo(() => Array.from({ length: 70 }, (_, i) => ({ x: (Math.random() - 0.5) * 520, y: -260 - Math.random() * 260, r: Math.random() * 720 - 360, c: ["#E5484D", "#1F9D8B", "#F2B544", "#3BB3C9", "#15171A"][i % 5], d: 0.9 + Math.random() * 0.7, w: 6 + Math.random() * 6 })), [run]);
  return (
    <div className="confetti" aria-hidden="true">
      {bits.map((b, i) => (
        <motion.i key={`${run}-${i}`} style={{ background: b.c, width: b.w, height: b.w * 1.6 }}
          initial={{ x: 0, y: 0, rotate: 0, opacity: 1 }} animate={{ x: [0, b.x * 0.6, b.x], y: [0, b.y, b.y + 520], rotate: b.r, opacity: [1, 1, 0] }}
          transition={{ duration: b.d * 2.2, ease: ["easeOut", "easeIn"], times: [0, 0.35, 1] }} />
      ))}
    </div>
  );
}

function Game({ onMenu }: { onMenu: () => void }) {
  const [roundNo, setRoundNo] = useState(1);
  const [gameId, setGameId] = useState(newGameId);
  // computer: the action bar sits inside the card; phone: it floats over the crowd to save space
  const [wide, setWide] = useState(() => window.matchMedia("(min-width: 900px)").matches);
  useEffect(() => { const q = window.matchMedia("(min-width: 900px)"); const f = () => setWide(q.matches); q.addEventListener("change", f); return () => q.removeEventListener("change", f); }, []);
  const [round, setRound] = useState(() => newRound());
  const [phase, setPhase] = useState<string>("deal");
  const [turn, setTurn] = useState(0);              // whose turn in deal / vote
  const [handed, setHanded] = useState(false);
  const [seen, setSeen] = useState(false);
  const [speaker, setSpeaker] = useState(0);
  const TOTAL = RULES.secs ?? 120;
  const [left, setLeft] = useState(TOTAL);
  const [running, setRunning] = useState(false);
  const [votes, setVotes] = useState<Record<number, number>>({});
  const [pick, setPick] = useState<number | null>(null);
  const [revealed, setRevealed] = useState(false);
  const [guess, setGuess] = useState<string | null>(null);
  const [cheer, setCheer] = useState(false);
  const [crowdScale] = useState(() => (window.innerWidth >= 900 ? 1.25 : 2));
  const [boom, setBoom] = useState(0);
  const [glass, setGlass] = useState(true);

  // the clue timer
  useEffect(() => {
    if (!running || phase !== "clues") return;
    const t = setInterval(() => setLeft((l) => { if (l <= 1) { setRunning(false); navigator.vibrate?.([60, 40, 60]); return 0; } return l - 1; }), 1000);
    return () => clearInterval(t);
  }, [running, phase]);

  const tally = useMemo(() => { const t = PLAYERS.map(() => 0); Object.values(votes).forEach((v) => { if (v >= 0) t[v]++; }); return t; }, [votes]);
  const top = Math.max(...tally);
  const leaders = tally.map((n, i) => (n === top && top > 0 ? i : -1)).filter((i) => i >= 0);
  const accused = leaders.length === 1 ? leaders[0] : null;
  const caught = accused === round.imposter;
  const outcome = !caught ? "escaped" : guess === round.word ? "stolen" : "caught";
  const options = useMemo(() => shuffled([round.word, ...shuffled(PACK.words.filter((w) => w !== round.word)).slice(0, 7)]), [round]);

  const go = (p: string) => {
    setPhase(p); setTurn(0); setHanded(false); setSeen(false); setPick(null);
    if (p === "clues") { setSpeaker(0); setLeft(TOTAL); setRunning(RULES.timer); }
    if (p === "reveal") setRevealed(false);
    setCheer(false);
    document.querySelector(".gcard .panel-body")?.scrollTo({ top: 0, behavior: "smooth" });
  };
  // preview tabs: jump anywhere, filling in plausible earlier steps
  const jump = (p: string) => {
    if ((p === "reveal" || p === "results") && Object.keys(votes).length < PLAYERS.length) {
      const v: Record<number, number> = {}; PLAYERS.forEach((_, i) => { v[i] = i === round.imposter ? (round.imposter + 1) % PLAYERS.length : (Math.random() < 0.75 ? round.imposter : (i + 2) % PLAYERS.length === i ? round.imposter : (i + 2) % PLAYERS.length); }); setVotes(v);
    }
    if (p === "results") finish(guess);
    else go(p);
  };
  const points = (o: string) => PLAYERS.map((_, i) => {
    if (i === round.imposter) return o === "escaped" ? 3 : o === "stolen" ? 2 : 0;

  });
  const finish = (g: string | null) => {
    setGuess(g);
    go("results");
    setTimeout(() => { setCheer(true); setBoom((b) => b + 1); }, 350);
  };
  const nextRound = () => {
    const o = outcome; const pts = points(o);
    setRound(newRound(round.scores.map((s, i) => s + pts[i]))); setRoundNo((n) => n + 1); setVotes({}); setGuess(null); go("deal");
  };
  const newGame = () => { setGameId(newGameId()); setRound(newRound()); setRoundNo(1); setVotes({}); setGuess(null); go("deal"); };


  // the action dock lives in the people area at the bottom: the main button for every step
  const dockFor = (): { sum: string; sub: string; alt?: { label: string; on: () => void; on2?: boolean }; alts?: { label: string; on: () => void; icon?: string }[]; btn?: { label: string; on: () => void; disabled?: boolean; tone?: string } } => {
    const nm = (i: number) => PLAYERS[i].name; const N = PLAYERS.length;
    if (phase === "deal") {
      const who = nm(round.order[turn]);
      if (!handed) return { sum: `Card ${turn + 1} of ${N}`, sub: "Everyone else, look away", btn: { label: `I’m ${who}`, on: () => { setHanded(true); setSeen(false); } } };
      return { sum: seen ? "Got it? Hide it and pass on" : "Press and hold the card", sub: `${who}’s turn · card ${turn + 1} of ${N}`,
        btn: { label: turn + 1 < N ? "Hide and pass on" : "Start the clues", disabled: !seen, on: () => { if (turn + 1 < N) { setTurn(turn + 1); setHanded(false); } else go("clues"); } } };
    }
    if (phase === "clues") return { sum: left > 0 ? `${nm(round.order[speaker % N])} is giving a clue` : "Time’s up", sub: `${PACK.name} · 1 imposter among ${N}`,
      alt: { label: "Next speaker", on: () => setSpeaker((x) => x + 1) }, btn: { label: "Start the vote", on: () => go("vote") } };
    if (phase === "vote" && RULES.outLoud) return { sum: pick === null || pick === -1 ? "Agree out loud, then tap a face" : `The table picks ${nm(pick)}`, sub: "Votes out loud",
      btn: { label: "Vote them out", disabled: pick === null || pick === -1, tone: "red", on: () => { const v: Record<number, number> = {}; PLAYERS.forEach((_, i) => { v[i] = pick!; }); setVotes(v); go("reveal"); } } };
    if (phase === "vote") {
      if (!handed) return { sum: `Vote ${turn + 1} of ${N}`, sub: "Votes are secret", btn: { label: `I’m ${nm(turn)}`, on: () => { setHanded(true); setPick(null); } } };
      return { sum: pick === null ? "Tap a face to vote" : pick === -1 ? "Skipping this vote" : `Voting for ${nm(pick)}`, sub: `${nm(turn)} is voting`,
        alt: { label: pick === -1 ? "✓ Skipping" : "Skip", on: () => setPick(-1), on2: pick === -1 },
        btn: { label: "Lock in vote", disabled: pick === null, tone: "red", on: () => { setVotes({ ...votes, [turn]: pick! }); if (turn + 1 < N) { setTurn(turn + 1); setHanded(false); } else go("reveal"); } } };
    }
    if (phase === "reveal") {
      if (accused === null) return { sum: "It’s a tie", sub: "Nobody is voted out", btn: { label: "See who it was", on: () => finish(null) } };
      if (!revealed) return { sum: `${nm(accused)} got the most votes`, sub: "Moment of truth", btn: { label: `Reveal ${nm(accused)}’s card`, tone: "red", on: () => setRevealed(true) } };
      return caught && !RULES.last ? { sum: `${nm(accused)} was the imposter`, sub: "Busted, no last guess this game", btn: { label: "See the results", on: () => finish(null) } }
        : caught ? { sum: "One last chance", sub: `${nm(accused)} can still steal the round`, btn: { label: `Pass to ${nm(accused)}`, on: () => go("guess") } }
        : { sum: `${nm(accused)} was innocent`, sub: `The imposter was ${nm(round.imposter)}`, btn: { label: "See the results", on: () => finish(null) } };
    }
    if (phase === "guess") return { sum: "Tap the word you think it was", sub: `${nm(round.imposter)} is guessing` };
    return { sum: outcome === "caught" ? "Crew wins this round" : "Imposter wins this round", sub: `Round ${roundNo} done · the word was ${round.word}`,
      alts: [{ label: "Main menu", on: onMenu, icon: "M3 12l9-8 9 8M5 10v10h14V10" }, { label: "New game", on: newGame, icon: "M4 4v6h6M20 20v-6h-6M5.6 15a8 8 0 0 0 13.4 3M18.4 9A8 8 0 0 0 5 6" }],
      btn: { label: "Continue", on: nextRound } };
  };
  const dock = dockFor();
  const dockEl = (
      <motion.div className={`dock ${wide ? "in-card" : ""}`} initial={{ y: 40, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ duration: 0.5, delay: 0.2, ease }}>
        <AnimatePresence mode="popLayout" initial={false}>
          <motion.div key={dock.sum} className="dock-sum" initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: 0.25 }}>

          </motion.div>
        </AnimatePresence>
        {dock.alts?.map((a) => <motion.button key={a.label} type="button" className="dock-alt with-ico" whileTap={{ scale: 0.95 }} onClick={a.on} aria-label={a.label}>{a.icon && <Ln d={a.icon} />}<span>{a.label}</span></motion.button>)}
        {dock.alt && <motion.button type="button" className={`dock-alt ${dock.alt.on2 ? "on" : ""}`} whileTap={{ scale: 0.95 }} onClick={dock.alt.on}>{dock.alt.label}</motion.button>}
        {dock.btn && <MBWrap><motion.button type="button" className={`go dock-go ${dock.btn.tone ?? ""}`} disabled={dock.btn.disabled} whileTap={{ scale: 0.96 }} onClick={dock.btn.on}>
          {dock.btn.label}<Ln d="M5 12h14M13 6l6 6-6 6" /></motion.button></MBWrap>}
      </motion.div>
  );
  const phaseIndex = PHASES.findIndex(([k]) => k === phase || (phase === "guess" && k === "reveal"));
  const pts = points(outcome);
  useEffect(() => {
    if (phase !== "results") return;
    recordRound({ game: gameId, mode: "local", pack: PACK.name, round: roundNo, word: round.word, imposter: PLAYERS[round.imposter].name, outcome,
      players: PLAYERS.map((p, i) => ({ name: p.name, sprite: p.sprite, points: pts[i], total: round.scores[i] + pts[i] })) });
  }, [phase]);
  const ranked = PLAYERS.map((p, i) => ({ ...p, i, total: round.scores[i] + (phase === "results" ? pts[i] : 0) })).sort((a, b) => b.total - a.total);

  return (
    <div className={`frame center-stage ${glass ? "glass" : ""}`}>

        <div className="brand gutter"><span className="mark">IMP<i>O</i>STER</span><button type="button" className="menu-btn" onClick={onMenu} aria-label="Main menu"><Ln d="M15 6l-6 6 6 6" /><span>Menu</span></button>
        <div className="look" role="group" aria-label="Card style">

        <div className="panel-body gutter">

            {phase === "deal" && (

                    <motion.button className="go wide" type="button" disabled={!seen} whileTap={{ scale: 0.97 }}
                      onClick={() => { if (turn + 1 < PLAYERS.length) { setTurn(turn + 1); setHanded(false); } else go("clues"); }}>

            )}

            {/* ---------------- CLUES ---------------- */}
            {phase === "clues" && (

                <ol className="order">

                      <motion.li key={pi} layout className={now ? "now" : ""} onClick={() => setSpeaker(k)}>

                      </motion.li>

                </ol>
                <div className="row-btns">

              </motion.section>
            )}

            {/* ---------------- VOTE ---------------- */}
            {phase === "vote" && (
              <motion.section key={`vote-${turn}-${handed}`} className="stage st-vote" initial={{ opacity: 0, x: 40 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -40 }} transition={{ duration: 0.35, ease }}>
                <div className="dots" aria-label={`Vote ${turn + 1} of ${PLAYERS.length}`}>{PLAYERS.map((_, i) => <i key={i} className={i < turn ? "done" : i === turn ? "now" : ""} />)}</div>
                {!handed && !RULES.outLoud ? (
                  <HandOff i={turn} note="Votes are secret. Nobody sees who you pick." onReady={() => { setHanded(true); setPick(null); }} />
                ) : (
                  <>
                    <h2 className="title">{RULES.outLoud ? "Talk it out. Who does the table vote out?" : `${PLAYERS[turn].name}, who’s the imposter?`}</h2>
                    <div className="vgrid">
                      {PLAYERS.map((p, i) => i === turn && !RULES.outLoud ? null : (
                        <motion.button key={p.name} type="button" className={`vtile ${pick === i ? "on" : ""}`} aria-pressed={pick === i} onClick={() => setPick(i)} whileTap={{ scale: 0.95 }} layout>
                          <Avatar i={i} size={64} ring={pick === i ? "#E5484D" : undefined} /><strong>{p.name}</strong>
                          <AnimatePresence>{pick === i && <motion.span className="stamp" initial={{ scale: 2, opacity: 0, rotate: -20 }} animate={{ scale: 1, opacity: 1, rotate: -10 }} exit={{ opacity: 0 }}>SUS</motion.span>}</AnimatePresence>
                        </motion.button>
                      ))}
                    </div>
                    <div className="row-btns spread">
                      <button type="button" className="btn light" onClick={() => setPick(-1)} aria-pressed={pick === -1}>{pick === -1 ? "✓ Skipping" : "Skip my vote"}</button>
                      <motion.button type="button" className="go" disabled={pick === null} whileTap={{ scale: 0.96 }} onClick={() => {
                        const v = { ...votes, [turn]: pick! }; setVotes(v);
                        if (turn + 1 < PLAYERS.length) { setTurn(turn + 1); setHanded(false); } else go("reveal");
                      }}>Lock in vote<Ln d="M5 12.5l4.5 4.5L19 7.5" /></motion.button>
                    </div>
                  </>
                )}
              </motion.section>
            )}

            {/* ---------------- REVEAL ---------------- */}
            {phase === "reveal" && (
              <motion.section key="reveal" className="stage st-reveal" initial={{ opacity: 0, x: 40 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -40 }} transition={{ duration: 0.35, ease }}>
                <h2 className="title">The votes are in</h2>
                <div className="bars">
                  {PLAYERS.map((p, i) => (
                    <div key={p.name} className={`bar ${i === accused ? "lead" : ""}`}>
                      <Avatar i={i} size={34} /><strong>{p.name}</strong>
                      <div className="track"><motion.i initial={{ width: 0 }} animate={{ width: `${(tally[i] / PLAYERS.length) * 100}%` }} transition={{ duration: 0.8, delay: 0.2 + i * 0.12, ease }} /></div>
                      <span className="cnt">{tally[i]}</span>
                    </div>
                  ))}
                </div>
                {accused === null ? (
                  <div className="verdict tie"><strong>It’s a tie.</strong><span>Nobody is voted out, so the imposter escapes.</span>
                    <motion.button className="go wide" type="button" whileTap={{ scale: 0.97 }} onClick={() => finish(null)}>See who it was</motion.button></div>
                ) : !revealed ? (
                  <motion.button className="go wide" type="button" whileTap={{ scale: 0.97 }} onClick={() => setRevealed(true)} initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 1 }}>
                    Reveal {PLAYERS[accused].name}’s card
                  </motion.button>
                ) : (
                  <motion.div className={`verdict ${caught ? "caught" : "wrong"}`} initial={{ rotateY: 90, opacity: 0 }} animate={{ rotateY: 0, opacity: 1 }} transition={{ type: "spring", stiffness: 140, damping: 16 }}>
                    <Avatar i={accused} size={72} ring={caught ? "#E5484D" : "#1F9D8B"} />
                    <strong>{PLAYERS[accused].name} {caught ? "was the imposter!" : "was innocent."}</strong>
                    <span>{caught ? (RULES.last ? "One last chance: if they name the word, they steal the round." : "Busted. The crew wins.") : `The real imposter was ${PLAYERS[round.imposter].name}.`}</span>
                    <motion.button className="go wide" type="button" whileTap={{ scale: 0.97 }} onClick={() => (caught ? go("guess") : finish(null))}>{caught ? `Pass the phone to ${PLAYERS[accused].name}` : "See the results"}</motion.button>
                  </motion.div>
                )}
              </motion.section>
            )}

            {/* ---------------- LAST GUESS ---------------- */}
            {phase === "guess" && (
              <motion.section key="guess" className="stage st-guess" initial={{ opacity: 0, x: 40 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -40 }} transition={{ duration: 0.35, ease }}>
                <span className="label">Last chance</span>
                <h2 className="title">{PLAYERS[round.imposter].name}, what was the word?</h2>
                <p className="muted">Pick right and you steal the round.</p>
                <div className="ggrid">
                  {options.map((w, i) => (
                    <motion.button key={w} type="button" className="gtile" whileTap={{ scale: 0.95 }} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i * 0.05 }}
                      onClick={() => finish(w)}>{w}</motion.button>
                  ))}
                </div>
              </motion.section>
            )}

            {/* ---------------- RESULTS ---------------- */}
            {phase === "results" && (
              <motion.section key="results" className="stage st-results" initial={{ opacity: 0, x: 40 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -40 }} transition={{ duration: 0.35, ease }}>
                <div className={`result ${outcome}`}>
                  <span className="label">{outcome === "caught" ? "Crew wins" : "Imposter wins"}</span>
                  <strong>{outcome === "caught" ? `${PLAYERS[round.imposter].name} was caught` : outcome === "stolen" ? `${PLAYERS[round.imposter].name} guessed “${round.word}”` : `${PLAYERS[round.imposter].name} fooled everyone`}</strong>
                  <div className="wordline"><span>The word was</span><b>{round.word}</b></div>
                </div>
                <div className="board">
                  {ranked.map((p, k) => (
                    <motion.div key={p.name} layout className="brow" initial={{ opacity: 0, x: -16 }} animate={{ opacity: 1, x: 0 }} transition={{ delay: 0.3 + k * 0.08 }}>
                      <span className="rank">{k + 1}</span><Avatar i={p.i} size={36} ring={p.i === round.imposter ? "#E5484D" : undefined} />
                      <strong>{p.name}{p.i === round.imposter && <em>imposter</em>}</strong>
                      {pts[p.i] > 0 && <motion.span className="plus" initial={{ scale: 0 }} animate={{ scale: 1 }} transition={{ delay: 0.8 + k * 0.08, type: "spring", stiffness: 500, damping: 14 }}>+{pts[p.i]}</motion.span>}
                      <span className="total">{p.total}</span>
                    </motion.div>
                  ))}
                </div>
                <motion.button className="go wide" type="button" whileTap={{ scale: 0.97 }} onClick={nextRound}>Next round<Ln d="M5 12h14M13 6l6 6-6 6" /></motion.button>
              </motion.section>
            )}
          </AnimatePresence>
        </div>
        {/* phase-aware bar at the bottom: what's happening and the main action */}
        {phase === "clues" && (
          <div className="cta gutter">
            <div className="cta-sum"><strong>{left > 0 ? `${PLAYERS[round.order[speaker % PLAYERS.length]].name} is giving a clue` : "Time’s up"}</strong><span>{PACK.name} · 1 imposter among {PLAYERS.length}</span></div>
            <motion.button className="go" type="button" whileTap={{ scale: 0.96 }} onClick={() => go("vote")}>Start the vote<Ln d="M5 12h14M13 6l6 6-6 6" /></motion.button>
          </div>
        )}
        {wide && dockEl}
      </motion.aside>
      {!wide && dockEl}
      {phase === "results" && <Confetti run={boom} />}
    </div>
  );
}

/* =====================================================================================
   History and leaderboard. Every finished round is saved on this phone, for pass-and-play and
   online rooms alike, so the leaderboard and each player's history survive closing the app.
   ===================================================================================== */
const HIST_KEY = "imposter-history-v1";
const loadHistory = (): any[] => { try { return JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch { return []; } };
const newGameId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
/** r: { game, mode, pack, round, word, imposter (name), outcome, players: [{ name, sprite, points, total }] } */
function recordRound(r: any) {
  try {
    const h = loadHistory();
    if (h.some((x) => x.game === r.game && x.round === r.round)) return;
    h.push({ ...r, at: Date.now() });
    localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(-600)));
  } catch {}
}
function summarize(h: any[]) {
  const P: Record<string, any> = {};
  for (const r of h) for (const p of r.players) {
    const k = p.name.trim().toLowerCase(); if (!k) continue;
    const s = (P[k] ??= { name: p.name, sprite: p.sprite, rounds: 0, points: 0, crewWins: 0, impWins: 0, timesImp: 0, games: new Set(), log: [] });
    const imp = p.name === r.imposter; const crewWon = r.outcome === "caught";
    s.rounds += 1; s.points += p.points; s.games.add(r.game); s.sprite = p.sprite;
    if (imp) { s.timesImp += 1; if (!crewWon) s.impWins += 1; } else if (crewWon) s.crewWins += 1;
    s.log.push({ at: r.at, pack: r.pack, word: r.word, imp, won: imp ? !crewWon : crewWon, points: p.points, mode: r.mode });
  }
  const players = Object.values(P).map((s: any) => ({ ...s, games: s.games.size, wins: s.crewWins + s.impWins })).sort((a: any, b: any) => b.points - a.points || b.wins - a.wins);
  const games: Record<string, any> = {};
  for (const r of h) { const g = (games[r.game] ??= { id: r.game, at: r.at, pack: r.pack, mode: r.mode, rounds: 0, totals: {} as Record<string, number> }); g.rounds += 1; g.at = r.at; r.players.forEach((p: any) => { g.totals[p.name] = p.total; }); }
  const gameList = Object.values(games).sort((a: any, b: any) => b.at - a.at).map((g: any) => { const best = Object.entries(g.totals).sort((a: any, b: any) => b[1] - a[1])[0]; return { ...g, leader: best?.[0], leaderPts: best?.[1] }; });
  return { players, games: gameList };
}
const fmtDate = (t: number) => { try { return new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " · " + new Date(t).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); } catch { return ""; } };

function HowTo({ onClose }: { onClose: () => void }) {

  const t = topic.toLowerCase();
  const all = [...OFFLINE_PACKS, ...LIBRARY.map((p: any) => ({ name: p.name, keys: [p.name.toLowerCase(), ...p.name.toLowerCase().split(/\s+/)], words: p.words }))];
  let best: any = null; let score = 0;
  for (const p of all) {
    const s = p.keys.reduce((n: number, k: string) => n + (t.includes(k) ? k.length + 2 : k.split(/\s+/).some((w) => w.length > 3 && t.includes(w.slice(0, -1))) ? 1 : 0), 0) + (t.includes(p.name.toLowerCase()) ? 6 : 0);
    if (s > score) { score = s; best = p; }
  }
  return best ? { name: best.name, words: best.words, icon: "spark" } : null;
}

/* ---------- scan a room QR from inside the app (where the browser can read QR codes) ---------- */
function QRScanner({ onCode, onClose }: { onCode: (c: string) => void; onClose: () => void }) {
  const vid = useRef<HTMLVideoElement>(null); const [err, setErr] = useState("");
  useEffect(() => {
    let stream: MediaStream | null = null; let raf = 0; let alive = true;
    (async () => {
      try {
        const Det = (window as any).BarcodeDetector; if (!Det) throw new Error("unsupported");
        const det = new Det({ formats: ["qr_code"] });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (!vid.current) return; vid.current.srcObject = stream; await vid.current.play();
        const loop = async () => {
          if (!alive || !vid.current) return;
          try { const found = await det.detect(vid.current); const raw = found?.[0]?.rawValue as string | undefined;
            if (raw) { const m = raw.match(/[?&]room=([A-Za-z]{4})/) || raw.match(/^([A-Za-z]{4})$/); if (m) { onCode(m[1].toUpperCase()); return; } } } catch {}
          raf = requestAnimationFrame(loop);
        };
        loop();
      } catch (e: any) { setErr(e?.message === "unsupported" ? "This browser can’t scan inside the app. Open your phone’s camera app and point it at the QR instead." : "Camera access was blocked. Allow the camera, or type the code."); }
    })();
    return () => { alive = false; cancelAnimationFrame(raf); stream?.getTracks().forEach((t) => t.stop()); };
  }, []);
  return (
    <div className="scanner">
      {err ? <p className="net-err">{err}</p> : <><video ref={vid} playsInline muted /><span className="scan-frame" aria-hidden="true" /><span className="scan-tip">Point at the host’s QR</span></>}
      <button type="button" className="btn light" onClick={onClose}>Close camera</button>
    </div>
  );
}

/* =====================================================================================
   Online rooms. One phone hosts, the others join with the room code, the QR, or the link.
   Phones talk directly (WebRTC through PeerJS), so it works on the same Wi-Fi, on the host's
   hotspot, or from anywhere. The host phone runs the game and sends each phone only its own view.
   ===================================================================================== */
const ROOM_PREFIX = "imposter-party-room-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ";
const makeCode = () => Array.from({ length: 4 }, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join("");
const joinLink = (code: string) => `${location.origin}${location.pathname}?room=${code}`;
const NEAR_PREFIX = "imposter-party-near-";
let netKeyP: Promise<string> | null = null;
/** Same Wi-Fi or hotspot = same short network code (from /api/net). Empty when it can't be found. */
const getNetKey = () => (netKeyP ??= fetch("/api/net", { cache: "no-store" }).then((r) => r.json()).then((j) => String(j?.key || "")).catch(() => ""));
/** Ask WebRTC how a connection actually travels: "local" when both ends are on the same network. */
async function routeOf(cn: any): Promise<"local" | "online" | ""> {
  try {
    const st = await cn?.peerConnection?.getStats(); if (!st) return "";
    let pair: any = null; st.forEach((r: any) => { if (r.type === "transport" && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });
    if (!pair) st.forEach((r: any) => { if (r.type === "candidate-pair" && (r.nominated || r.selected) && r.state === "succeeded") pair = r; });
    if (!pair) return "";
    const l = st.get(pair.localCandidateId), rm = st.get(pair.remoteCandidateId);
    return l?.candidateType === "host" && rm?.candidateType === "host" ? "local" : "online";
  } catch { return ""; }
}
const loadName = () => { try { return localStorage.getItem("imposter-name") || ""; } catch { return ""; } };
const saveName = (n: string) => { try { localStorage.setItem("imposter-name", n); } catch {} };

function QR({ text, size = 176 }: { text: string; size?: number }) {
  const svg = useMemo(() => {
    try { const q = (window as any).qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch { return ""; }
  }, [text]);
  return <div className="qr" style={{ width: size, height: size }} dangerouslySetInnerHTML={{ __html: svg }} aria-label="QR code to join this room" role="img" />;
}

/** The host's game: the single source of truth. Guests only ever see what viewFor() gives them. */
function createHost(cfg: any, code: string, push: (v: any) => void) {
  const S: any = { code, phase: "lobby", players: [] as any[], rules: { secs: 120, ...cfg.rules }, pack: cfg.pack, round: 0, word: "", imposter: -1, order: [] as number[], speaker: 0,
    endsAt: 0, paused: false, leftMs: 0, votes: {} as Record<number, number>, accused: null as number | null, revealed: false, guess: null as string | null, outcome: null as string | null, points: null as number[] | null, options: [] as string[] };
  let tick: any = null;
  const used = () => S.players.map((p: any) => p.sprite);
  const addPlayer = (id: string, name: string, conn: any) => {
    const p = { id, name: name.slice(0, 14) || `Player ${S.players.length + 1}`, sprite: nextSprite(S.players), conn, online: true, ready: false, score: 0, net: id === "host" ? "host" : "" };
    S.players.push(p); return p;
  };
  const tally = () => S.players.map((_: any, k: number) => Object.values(S.votes).filter((v) => v === k).length);
  const leftNow = () => S.paused ? S.leftMs : S.endsAt ? Math.max(0, S.endsAt - Date.now()) : 0;
  const viewFor = (p: any) => {
    const i = S.players.indexOf(p); const isImp = i === S.imposter; const playing = S.phase !== "lobby";
    const late = S.phase === "results" || (S.phase !== "reveal" && S.phase !== "vote" && S.phase !== "clues" && S.phase !== "deal" && S.phase !== "lobby");
    return {
      code: S.code, phase: S.phase, me: i, isHost: p.id === "host", round: S.round, packName: S.pack.name,
      rules: { hint: S.rules.hint, last: S.rules.last, timer: S.rules.timer, outLoud: S.rules.outLoud, secs: S.rules.secs },
      players: S.players.map((q: any, k: number) => ({ name: q.name, sprite: q.sprite, net: q.net, online: q.online, ready: q.ready, voted: S.votes[k] !== undefined, score: q.score })),
      role: playing ? (isImp ? "imposter" : "crew") : null,
      word: (playing && !isImp) || S.phase === "results" ? S.word : null,
      hint: isImp ? (S.rules.hint ? S.pack.name : null) : S.pack.name,
      order: S.order, speaker: S.speaker, timerLeft: leftNow(), paused: S.paused,
      myVote: S.votes[i], tally: ["reveal", "guess", "results"].includes(S.phase) ? tally() : null,
      accused: S.accused, revealed: S.revealed,
      imposter: S.phase === "results" || (S.revealed && S.accused === S.imposter) || late ? S.imposter : null,
      options: S.phase === "guess" && isImp ? S.options : null, guess: S.guess, outcome: S.outcome, points: S.points,
      guesser: S.phase === "guess" ? S.imposter : null,
    };
  };
  const broadcast = () => S.players.forEach((p: any) => { if (p.id === "host") push(viewFor(p)); else if (p.conn?.open) { try { p.conn.send({ t: "view", v: viewFor(p) }); } catch {} } });
  const online = () => S.players.filter((p: any) => p.online);
  const newRound = () => {
    S.round += 1; const ws = S.pack.words; S.word = ws[rnd(ws.length)]; S.imposter = rnd(S.players.length);
    let order = shuffled(S.players.map((_: any, k: number) => k)); if (order[0] === S.imposter) order = [...order.slice(1), order[0]];
    S.order = order; S.players.forEach((p: any) => { p.ready = false; }); S.votes = {}; S.accused = null; S.revealed = false; S.guess = null; S.outcome = null; S.points = null;
    S.speaker = 0; S.endsAt = 0; S.paused = false; S.phase = "deal";
  };
  const toClues = () => { S.phase = "clues"; S.speaker = 0; S.paused = false; S.endsAt = S.rules.timer ? Date.now() + S.rules.secs * 1000 : 0; armTick(); };
  const armTick = () => { clearTimeout(tick); if (S.phase === "clues" && S.endsAt && !S.paused) tick = setTimeout(() => broadcast(), Math.max(0, S.endsAt - Date.now()) + 50); };
  const toReveal = () => {
    const t = tally(); const top = Math.max(0, ...t); const leaders = t.map((n: number, k: number) => (n === top && top > 0 ? k : -1)).filter((k: number) => k >= 0);
    S.accused = leaders.length === 1 ? leaders[0] : null; S.revealed = false; S.phase = "reveal"; S.endsAt = 0; clearTimeout(tick);
  };
  const finish = (g: string | null) => {

                    <h2 className="title">{nm(me)}, your card</h2>
                    <SecretCard role={v.role} word={v.word ?? ""} onSeen={() => {}} />
                    <div className="ready-row">{P.map((p: any, k: number) => <span key={k} className={`rd ${p.ready ? "on" : ""}`} title={p.name}><SpriteFace sprite={p.sprite} size={26} /></span>)}</div>
                  </>)}

                  {v.phase === "clues" && (<>
                    <h2 className="title">Clue time</h2>
                    <p className="muted">One word each, in this order.{v.role === "imposter" ? " You’re the imposter: blend in." : ` Your word: ${v.word}.`}</p>
                    {v.rules.timer && <WaterTimer total={v.rules.secs} left={timerLeft} />}
                    {isHost && v.rules.timer && <div className="tctl"><button type="button" className="btn light" onClick={() => send({ t: "pause" })}>{v.paused ? "Resume" : "Pause"}</button><button type="button" className="btn light" onClick={() => send({ t: "add30" })}>+30 sec</button></div>}
                    <ol className="order">{v.order.map((pi: number, k: number) => { const now = k === v.speaker % P.length; return (
                      <li key={pi} className={now ? "now" : ""}><span className="n">{k + 1}</span><Face k={pi} size={36} ring={now ? "#0B4757" : undefined} /><strong>{nm(pi)}{pi === me && <em className="you">you</em>}</strong>{now && <span className="speaking">Speaking</span>}</li>); })}</ol>
                  </>)}

                  {v.phase === "vote" && (<>
                    <h2 className="title">{v.rules.outLoud ? "Who does the table vote out?" : v.myVote != null ? "Vote locked in" : "Who’s the imposter?"}</h2>
                    {(v.rules.outLoud ? isHost : v.myVote == null) ? (
                      <div className="vgrid">{P.map((p: any, k: number) => (!v.rules.outLoud && k === me) ? null : (
                        <motion.button key={k} type="button" className="vtile" whileTap={{ scale: 0.95 }} onClick={() => send(v.rules.outLoud ? { t: "tableVote", target: k } : { t: "vote", target: k })}>
                          <Face k={k} size={60} /><strong>{p.name}</strong></motion.button>))}</div>
                    ) : (
                      <div className="voted-list">{P.map((p: any, k: number) => <div key={k} className={`vl ${p.voted ? "on" : ""}`}><Face k={k} size={30} /><span>{p.name}</span><i>{p.voted ? "voted" : p.online ? "thinking…" : "away"}</i></div>)}</div>
                    )}
                  </>)}

                  {v.phase === "reveal" && (<>
                    <h2 className="title">The votes are in</h2>
                    <div className="bars">{P.map((p: any, k: number) => (
                      <div key={k} className={`bar ${k === v.accused ? "lead" : ""}`}><Face k={k} size={34} /><strong>{p.name}</strong>
                        <div className="track"><motion.i initial={{ width: 0 }} animate={{ width: `${((v.tally?.[k] ?? 0) / Math.max(1, P.length)) * 100}%` }} transition={{ duration: 0.8, delay: 0.2 + k * 0.1, ease }} /></div><span className="cnt">{v.tally?.[k] ?? 0}</span></div>))}</div>
                    {v.revealed && v.accused !== null && (
                      <motion.div className={`verdict ${v.imposter === v.accused ? "caught" : "wrong"}`} initial={{ rotateY: 90, opacity: 0 }} animate={{ rotateY: 0, opacity: 1 }} transition={{ type: "spring", stiffness: 140, damping: 16 }}>
                        <Face k={v.accused} size={72} ring={v.imposter === v.accused ? "#E5484D" : "#1F9D8B"} />
                        <strong>{nm(v.accused)} {v.imposter === v.accused ? "was the imposter!" : "was innocent."}</strong>
                        <span>{v.imposter === v.accused ? (v.rules.last ? "One last chance: if they name the word, they steal the round." : "Busted. The crew wins.") : "The real imposter is still hidden…"}</span>
                      </motion.div>)}
                  </>)}

                  {v.phase === "guess" && (v.options ? (<>
                    <span className="label">Last chance</span><h2 className="title">What was the word?</h2>
                    <div className="ggrid">{v.options.map((w: string, k: number) => <motion.button key={w} type="button" className="gtile" whileTap={{ scale: 0.95 }} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: k * 0.05 }} onClick={() => send({ t: "guess", word: w })}>{w}</motion.button>)}</div>
                  </>) : (<div className="lobby-wait big"><Face k={v.guesser} size={84} ring="#E5484D" /><strong>{nm(v.guesser)} is guessing the word</strong><DotLoaderMini /></div>))}

                  {v.phase === "results" && (<>
                    <div className={`result ${v.outcome}`}>
                      <span className="label">{v.outcome === "caught" ? "Crew wins" : "Imposter wins"}</span>
                      <strong>{v.outcome === "caught" ? `${nm(v.imposter)} was caught` : v.outcome === "stolen" ? `${nm(v.imposter)} guessed “${v.word}”` : `${nm(v.imposter)} fooled everyone`}</strong>
                      <div className="wordline"><span>The word was</span><b>{v.word}</b></div>
                    </div>
                    <div className="board">{P.map((p: any, k: number) => ({ ...p, k })).sort((a: any, b: any) => b.score - a.score).map((p: any, r: number) => (
                      <motion.div key={p.k} layout className="brow" initial={{ opacity: 0, x: -16 }} animate={{ opacity: 1, x: 0 }} transition={{ delay: 0.3 + r * 0.08 }}>
                        <span className="rank">{r + 1}</span><Face k={p.k} size={36} ring={p.k === v.imposter ? "#E5484D" : undefined} />
                        <strong>{p.name}{p.k === v.imposter && <em>imposter</em>}{p.k === me && <em className="you">you</em>}</strong>
                        {v.points?.[p.k] > 0 && <span className="plus">+{v.points[p.k]}</span>}<span className="total">{p.score}</span></motion.div>))}</div>
                  </>)}
                </motion.section>
              </AnimatePresence>
            </>
          )}
        </div>
        {dock && (
          <div className="dock in-card">
            <div className="dock-sum"><strong>{dock.sum}</strong><span>{dock.sub}</span></div>
            {dock.alts?.map((a: any) => <motion.button key={a.label} type="button" className={`dock-alt ${a.icon ? "with-ico" : ""}`} whileTap={{ scale: 0.95 }} onClick={a.on}>{a.icon && <Ln d={a.icon} />}<span>{a.label}</span></motion.button>)}
            {dock.btn && <MBWrap><motion.button type="button" className={`go dock-go ${dock.btn.tone ?? ""}`} disabled={dock.btn.disabled} whileTap={{ scale: 0.96 }} onClick={dock.btn.on}>{dock.btn.label}<Ln d="M5 12h14M13 6l6 6-6 6" /></motion.button></MBWrap>}
          </div>
        )}
      </motion.aside>
      <AnimatePresence>{toast && <motion.div className="toast" role="status" initial={{ y: 30, opacity: 0, x: "-50%" }} animate={{ y: 0, opacity: 1, x: "-50%" }} exit={{ y: 20, opacity: 0, x: "-50%" }}>{toast}</motion.div>}</AnimatePresence>
      {cheer && <Confetti run={v?.round ?? 0} />}
    </div>
  );
}

const DotLoaderMini = () => <span className="dotl" aria-hidden="true"><i /><i /><i /></span>;

/* ---------- moving border (from the user's component): a glow that travels round the main button ---------- */
function MovingBorder({ children, duration = 3200, rx = "16", ry = "16" }: { children: any; duration?: number; rx?: string; ry?: string }) {
  const pathRef = useRef<any>(null); const progress = useMotionValue(0);
  useAnimationFrame((time: number) => { const len = pathRef.current?.getTotalLength?.(); if (len) progress.set((time * (len / duration)) % len); });
  const x = useTransform(progress, (val: number) => pathRef.current?.getPointAtLength(val).x ?? 0);
  const y = useTransform(progress, (val: number) => pathRef.current?.getPointAtLength(val).y ?? 0);
  const transform = useMotionTemplate`translateX(${x}px) translateY(${y}px) translateX(-50%) translateY(-50%)`;
  return (<>
    <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" className="mb-svg" width="100%" height="100%"><rect fill="none" width="100%" height="100%" rx={rx} ry={ry} ref={pathRef} /></svg>
    <motion.div style={{ position: "absolute", top: 0, left: 0, display: "inline-block", transform }}>{children}</motion.div>
  </>);
}
function MBWrap({ children, wide = false }: { children: any; wide?: boolean }) {
  return <span className={`mb ${wide ? "wide" : ""}`}><span className="mb-track" aria-hidden="true"><MovingBorder><i className="mb-glow" /></MovingBorder></span>{children}</span>;
}

/* ---------- the lever switch (from the user's component), for the rules ---------- */
function Lever({ on, onChange, label }: { on: boolean; onChange: (v: boolean) => void; label: string }) {
  return (
    <button type="button" role="switch" aria-checked={on} aria-label={label} className="lever switch-like" onClick={(e) => { e.stopPropagation(); onChange(!on); navigator.vibrate?.(8); }}>
      <span className="lever-base"><span className="lever-slot" /></span>
      <span className="lever-arm"><span className="lever-rod" /><span className="lever-knob" /></span>
    </button>
  );
}

function Root() {
  const linkRoom = (() => { try { return (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); } catch { return ""; } })();
  const [screen, setScreen] = useState<"home" | "game" | "room">(linkRoom ? "room" : "home");
  const [room, setRoom] = useState<any>(linkRoom ? { role: "guest", code: linkRoom } : null);
  const toHome = () => { setScreen("home"); window.scrollTo(0, 0); try { history.replaceState(null, "", location.pathname); } catch {} };
  const [run, setRun] = useState(0);
  const start = (cfg: any) => { PLAYERS = cfg.players; PACK = cfg.pack; RULES = cfg.rules; setRun((r) => r + 1); setScreen("game"); window.scrollTo(0, 0); };
  return (
    <AnimatePresence mode="wait">
      {screen === "home"
        ? <motion.div key="home" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0, scale: 1.02, filter: "blur(6px)" }} transition={{ duration: 0.4, ease }}><Home onStart={start} onRoom={(role, cfg) => { setRoom({ role, cfg }); setRun((r) => r + 1); setScreen("room"); window.scrollTo(0, 0); }} /></motion.div>
        : screen === "room" ? <motion.div key={`room-${run}`} initial={{ opacity: 0, scale: 0.98 }} animate={{ opacity: 1, scale: 1 }} exit={{ opacity: 0, filter: "blur(6px)" }} transition={{ duration: 0.45, ease }}><NetRoom role={room.role} cfg={room.cfg} startCode={room.code} onMenu={toHome} /></motion.div>
        : <motion.div key={`game-${run}`} initial={{ opacity: 0, scale: 0.98 }} animate={{ opacity: 1, scale: 1 }} exit={{ opacity: 0, filter: "blur(6px)" }} transition={{ duration: 0.45, ease }}><Game onMenu={() => { setScreen("home"); window.scrollTo(0, 0); }} /></motion.div>}
    </AnimatePresence>
  );
}
ReactDOM.createRoot(document.getElementById("root")!).render(<Root />);

</script>
